name: Frozen source integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify frozen source files against published manifest
        run: sha256sum --check --strict SHA256SUMS
      - name: Verify frozen source files against pinned baseline hashes
        shell: bash
        run: |
          printf '%s  %s\n' \
            '1a627bccc2a9eb5a5f45d5a178b446b2fc6c7bcb54df19443f4a28df68bf5d1d' 'scripts/pve-config-backup' \
            '43170fbb3d412ad8cffe4706a13941eb7054636bb9783fccc3b8393dc47c62c5' 'scripts/pve-config-restore' \
            | sha256sum --check --strict -
